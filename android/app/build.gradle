plugins { id 'com.android.application' }

android {
    namespace 'com.gongxiangjia.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gongxiangjia.app"
        minSdk 24
        targetSdk 34
        versionCode 642
        versionName "0.6.42"
    }

    // 用自己的密钥签名：把 gxj.keystore 放到 android/ 目录，或在 gradle.properties 里配置
    signingConfigs {
        release {
            if (file("../gxj.keystore").exists()) {
                storeFile file("../gxj.keystore")
                storePassword project.findProperty("GXJ_STORE_PASSWORD") ?: ""
                keyAlias project.findProperty("GXJ_KEY_ALIAS") ?: "gxj"
                keyPassword project.findProperty("GXJ_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file("../gxj.keystore").exists()) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
