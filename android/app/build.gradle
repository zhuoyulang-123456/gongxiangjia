plugins { id 'com.android.application' }

android {
    namespace 'com.gongxiangjia.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gongxiangjia.app"
        minSdk 24
        targetSdk 34
        versionCode 642
        versionName "0.6.42"
    }

    signingConfigs {
        release {
            storeFile file("../gxj.keystore")
            storePassword "gxj123456"
            keyAlias "gxj"
            keyPassword "gxj123456"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
