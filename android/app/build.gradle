plugins { id 'com.android.application' }

android {
    namespace 'com.gongxiangjia.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gongxiangjia.app"
        minSdk 24
        targetSdk 34
        versionCode 644
        versionName "0.6.44"
    }

    signingConfigs {
        release {
            storeFile file("../gxj.keystore")
            storePassword project.findProperty("GXJ_STORE_PASSWORD") ?: ""
            keyAlias project.findProperty("GXJ_KEY_ALIAS") ?: "gxj"
            keyPassword project.findProperty("GXJ_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
