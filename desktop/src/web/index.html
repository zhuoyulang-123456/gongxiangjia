<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F7FB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>共享夹</title>
  <link rel="apple-touch-icon" href="/m/icon.png" />
  <link rel="stylesheet" href="/m/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4.5l2 2.5H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </span>
      <div class="who">
        <h1>共享夹</h1>
        <p id="device">连接中…</p>
      </div>
    </div>
    <button class="iconbtn" id="refresh" aria-label="刷新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="pulldown" id="pulldown"><span class="spinner"></span></div>

  <main class="view" id="view-files">
    <div class="statline">
      <span class="dot" id="dot"></span>
      <span id="stat">正在连接电脑…</span>
    </div>

    <section class="card">
      <div class="cardhead">
        <h2>设备</h2>
        <span id="device-count" class="muted"></span>
      </div>
      <div id="device-list" class="list"></div>
    </section>

    <section class="card">
      <div class="cardhead">
        <h2>共享文件</h2>
        <span id="file-count" class="muted"></span>
      </div>
      <div id="file-list" class="list"></div>
      <div id="file-empty" class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4.5l2 2.5H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <p>还没有文件</p>
        <span>点右下角上传，或让电脑拖进来</span>
      </div>
    </section>

    <p class="footnote">文件只在你的设备之间传输 · 不经过服务器</p>
  </main>

  <main class="view hidden" id="view-text">
    <section class="card">
      <div class="cardhead">
        <h2>发文字</h2>
        <span class="muted">电脑上立刻能复制</span>
      </div>
      <div class="compose">
        <textarea id="text-input" rows="3" placeholder="输入或粘贴文字…"></textarea>
        <button class="btn primary" id="text-send">发送</button>
      </div>
    </section>

    <section class="card">
      <div class="cardhead">
        <h2>最近文字</h2>
        <span class="muted">点一下复制</span>
      </div>
      <div id="text-list" class="list"></div>
      <div id="text-empty" class="empty small">还没有文字</div>
    </section>
  </main>

  <main class="view hidden" id="view-settings">
    <section class="card">
      <div class="cardhead"><h2>悬浮球</h2></div>
      <div class="row">
        <div class="main">
          <div class="name">在屏幕上显示悬浮球</div>
          <div class="meta">收到文件/文字会弹出来，点球可发送</div>
        </div>
        <button class="tap" id="ball-toggle">开启</button>
      </div>
    </section>
    <section class="card">
      <div class="cardhead"><h2>连接</h2></div>
      <div class="row" id="row-addr">
        <div class="main"><div class="name">更换电脑地址</div><div class="meta">重新粘贴电脑上的链接</div></div>
        <span class="tap">打开</span>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab on" data-tab="files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4.5l2 2.5H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>文件</span>
    </button>
    <button class="tab" data-tab="text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h7"/></svg>
      <span>文字</span>
    </button>
    <button class="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <button class="fab" id="pick" aria-label="上传">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <input type="file" id="picker" multiple hidden />

  <div class="progress" id="progress">
    <div class="track"><div class="bar" id="bar"></div></div>
    <span id="progress-text"></span>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/m/app.js"></script>
</body>
</html>
