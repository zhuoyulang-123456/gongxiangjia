<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>共享夹</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4.5l2 2.5H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </span>
        <div class="brand-text">
          <h1>共享夹</h1>
          <p>设备之间直传 · 不经服务器</p>
        </div>
      </div>

      <div class="top-actions">
        <button class="code-chip" id="btn-code" title="点击复制本机设备码">
          <span>本机</span><b id="my-code">----</b>
        </button>
        <button class="icon-btn" id="btn-speed" title="传输速度与加速建议" aria-label="加速说明">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 1 9-9"/><path d="M12 12l4.5-4.5"/><circle cx="12" cy="12" r="1.4"/></svg>
        </button>
        <button class="icon-btn" id="btn-mobile" title="手机访问" aria-label="手机访问">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
        </button>
        <button class="icon-btn" id="btn-ball" title="显示/隐藏悬浮球" aria-label="显示悬浮球">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-btn" id="btn-link" title="配对链接" aria-label="配对链接">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>
        </button>
        <button class="icon-btn" id="btn-trash" title="回收站" aria-label="回收站">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>
          <span class="dot-badge hidden" id="trash-count">0</span>
        </button>
        <span class="v-divider"></span>
        <button class="btn btn-soft" id="btn-add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          添加文件
        </button>
        <button class="btn btn-primary" id="btn-open-folder">打开文件夹</button>
      </div>
    </header>

    <div class="statusbar">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">正在发现附近设备…</span>
      <span class="spacer"></span>
      <span class="speed-chip hidden" id="speed-chip"></span>
      <span class="secure-pill" title="内容在本机之间直接加密，不经过任何服务器">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        端到端加密
      </span>
    </div>

    <main class="content" id="dropzone">
      <section class="panel devices-panel">
        <div class="panel-head">
          <h2>设备</h2>
          <span class="panel-sub" id="device-summary">正在扫描…</span>
        </div>
        <div id="pending-list" class="dev-list hidden"></div>
        <div id="paired-list" class="dev-list"></div>
        <div id="nearby-list" class="dev-list"></div>
        <div id="nearby-empty" class="empty-line">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16a6 6 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/></svg>
          没发现别的设备。让另一台电脑也打开共享夹并连同一个网络，或用右上角的「配对链接」。
        </div>
      </section>

      <section class="panel text-panel">
        <div class="panel-head">
          <h2>文字</h2>
          <span class="panel-sub">其他设备立刻收到</span>
          <span class="spacer"></span>
          <button class="btn btn-small btn-ghost" id="text-clip">发送剪贴板</button>
          <span class="hint">选中文字也能直接拖到悬浮球</span>
        </div>
        <div class="text-compose">
          <textarea id="text-input" rows="2" placeholder="粘贴或输入文字，⌘↵ 发送"></textarea>
          <button id="text-send" class="btn btn-primary btn-send">发送</button>
        </div>
        <div id="text-list" class="text-list"></div>
      </section>

      <section class="panel files-panel">
        <div class="panel-head">
          <h2>共享文件</h2>
          <span class="panel-sub" id="file-count"></span>
          <span class="spacer"></span>
          <span class="hint">单击复制 · 双击打开 · 可拖出</span>
        </div>
        <div id="file-list" class="file-list"></div>
        <div id="empty-state" class="empty hidden">
          <div class="empty-art" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4.5l2 2.5H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 13h6"/></svg>
          </div>
          <p class="empty-title">共享夹还是空的</p>
          <p class="empty-hint">把文件拖到这里，或点「添加文件」<br />配对的设备会自动同步</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span id="device-name">—</span>
      <span class="footer-sep">·</span>
      <span>设备码 <b id="device-id">—</b></span>
      <span class="spacer"></span>
      <span class="footer-note">文件只在你的设备之间传输</span>
    </footer>

    <div id="drop-overlay" class="drop-overlay hidden">
      <div class="drop-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M4 3h16"/></svg>
        <span>松开，放进共享夹</span>
      </div>
    </div>
  </div>

  <div id="mask" class="mask hidden">
    <div class="dialog" role="dialog" aria-modal="true">
      <div class="dialog-head">
        <h2 id="dialog-title">标题</h2>
        <button id="dialog-close" class="icon-btn" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
